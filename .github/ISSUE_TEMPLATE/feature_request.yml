name: Feature request
description: Suggest an idea for AuthForge
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: API, schema, UX
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
