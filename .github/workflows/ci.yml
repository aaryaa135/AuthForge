name: AuthForge CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: authforge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install black==23.11.0 ruff==0.15.20

      - name: Ruff Lint
        run: ruff check .

      - name: Black Format Check
        run: black --check .

      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authforge_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-production-use-32chars
          JWT_ALGORITHM: HS256
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          APP_NAME: AuthForge
          APP_VERSION: 1.0.0
          ENVIRONMENT: test
          DEBUG: "false"
          API_HOST: 0.0.0.0
          API_PORT: 8000
          LOG_LEVEL: INFO
          FRONTEND_URL: http://localhost:8000
        run: alembic upgrade head

      - name: Seed Roles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authforge_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-production-use-32chars
          JWT_ALGORITHM: HS256
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          APP_NAME: AuthForge
          APP_VERSION: 1.0.0
          ENVIRONMENT: test
          DEBUG: "false"
          API_HOST: 0.0.0.0
          API_PORT: 8000
          LOG_LEVEL: INFO
        run: python scripts/seed_roles.py

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authforge_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-production-use-32chars
          JWT_ALGORITHM: HS256
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          APP_NAME: AuthForge
          APP_VERSION: 1.0.0
          ENVIRONMENT: test
          DEBUG: "false"
          API_HOST: 0.0.0.0
          API_PORT: 8000
          LOG_LEVEL: INFO
          FRONTEND_URL: http://localhost:8000
          ACCESS_TOKEN_EXPIRE_MINUTES: 15
          REFRESH_TOKEN_EXPIRE_DAYS: 7
        run: pytest -v --tb=short